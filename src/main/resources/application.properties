# CONFIGURACIÓN GENERAL
spring.application.name=auth-app

# BASE DE DATOS - POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres

#Ver una forma de poner la contraseña en secret
# Si la variable de entorno DB_PASSWORD está definida, se usa; si no, # cae a "adriel" (cómodo para desarrollo local).
# En producción SIEMPRE se define DB_PASSWORD en el entorno y el default nunca se usa.
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SERVIDOR
server.port=8080

# Desactiva Open Session In View. Fuerza a que las cargas perezosas
# se resuelvan dentro de la transacción del servicio y no en el
# controlador. Buena práctica obligatoria en producción.
spring.jpa.open-in-view=false

# JWT (JSON Web Token)
# Clave secreta para firmar los tokens (algoritmo HMAC-SHA256).
# Debe ser larga (mínimo 32 bytes = 256 bits) porque HS256 exige esa longitud.
# En producción SIEMPRE vendrá de una variable de entorno (JWT_SECRET) que idealmente rota cada cierto tiempo.
# Para generar una nueva clave puedes usar: openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# Tiempo de vida del token en milisegundos. 1 hora = 3600000.
# Un valor corto reduce la ventana de ataque si el token se filtra,
# pero obliga a reautenticar más seguido. Empezamos con 1 hora.
jwt.expiration-ms=3600000

# Nombre de la cookie que transporta el JWT. Lo definimos aquí para
# no tenerlo hardcodeado en varias clases.
jwt.cookie-name=access_token