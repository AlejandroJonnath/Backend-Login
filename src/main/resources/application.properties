# CONFIGURACIÓN GENERAL
spring.application.name=auth-app

# BASE DE DATOS - POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres

#Ver una forma de poner la contraseña en secret
# Si la variable de entorno DB_PASSWORD está definida, se usa; si no, # cae a "adriel" (cómodo para desarrollo local).
# En producción SIEMPRE se define DB_PASSWORD en el entorno y el default nunca se usa.
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SERVIDOR
server.port=8080

# Desactiva Open Session In View. Fuerza a que las cargas perezosas
# se resuelvan dentro de la transacción del servicio y no en el
# controlador. Buena práctica obligatoria en producción.
spring.jpa.open-in-view=false